name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# ビルド成果物だけを Pages に publish する権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を避けるため、concurrency group を分ける。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 依存パッケージは無いので、辞書とシミュレーションのテストだけ回す。
      # (ブラウザテストは Chrome を使うため CI では省く)
      - name: 辞書のテスト
        id: words
        run: |
          node test/words.test.js > words.log 2>&1
          status=$?
          echo "exit=$status" >> words.log
          cat words.log
          exit $status

      - name: 失敗ログを Issue に残す
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('words.log', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'words.test failure',
              body: '```\n' + body + '\n```'
            });

      - name: シミュレーションのテスト
        run: node test/sim.test.js

  deploy:
    name: デプロイ
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
